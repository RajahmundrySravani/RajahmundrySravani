
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate blue contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: RajahmundrySravani
          
outputs: |
  dist/sravani-snake.svg?color_snake=#38BDF8&color_dots=#0B1E3A,#123B68,#1D4ED8,#2563EB,#60A5FA
  dist/sravani-snake-dark.svg?color_snake=#38BDF8&color_dots=#0B1E3A,#123B68,#1D4ED8,#2563EB,#60A5FA

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
