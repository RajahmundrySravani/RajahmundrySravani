name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RajahmundrySravani
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237DD3FC&color_dots=%230F172A,%23075985,%230EA5E9,%2338BDF8,%237DD3FC
            dist/github-contribution-grid-snake-dark.svg?color_snake=%237DD3FC&color_dots=%23020617,%23075985,%230EA5E9,%2338BDF8,%237DD3FC

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
